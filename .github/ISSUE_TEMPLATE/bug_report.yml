name: Bug report
description: Report a bug.
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Summarize the bug.
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: List the steps to reproduce the bug.
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: Describe what you expected to happen.
  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
      description: Describe what happened.
  - type: input
    id: version-environment
    attributes:
      label: Version and environment
      description: Share the version and environment details.
